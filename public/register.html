<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Personal Finance Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

    <div class="auth-card">

        <div class="auth-header">
            <p class="eyebrow">PERSONAL FINANCE</p>
            <h1>Create your account</h1>
            <p>Start managing your money smarter.</p>
        </div>

        <form id="registerForm">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Your name" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a password" required>
            </div>

            <p id="registerMessage" class="form-message"></p>

            <button type="submit" class="primary-btn full-width">
                Create Account
            </button>

        </form>

        <p class="auth-switch">
            Already have an account?
            <a href="login.html">Sign in</a>
        </p>

    </div>

    <script src="js/auth.js"></script>

</body>

</html>
