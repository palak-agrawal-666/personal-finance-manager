<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Personal Finance</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="auth-page">

    <main class="auth-card">

        <div class="auth-brand">
            FINANCE MANAGER
        </div>

        <div class="auth-header">

            <p class="eyebrow">
                GET STARTED
            </p>

            <h1>
                Create your account
            </h1>

            <p>
                Start tracking your spending.
            </p>

        </div>


        <form id="registerForm">

            <div class="form-group">

                <label for="name">
                    Full name
                </label>

                <input type="text" id="name" placeholder="Your name" required>

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input type="email" id="email" placeholder="you@example.com" required>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input type="password" id="password" placeholder="At least 6 characters" minlength="6" required>

            </div>


            <div id="registerMessage" class="form-message"></div>


            <button type="submit" class="primary-btn full-width">
                Create account
            </button>

        </form>


        <p class="auth-switch">

            Already have an account?

            <a href="login.html">
                Sign in
            </a>

        </p>

    </main>


    <script src="js/auth.js"></script>

</body>

</html>
